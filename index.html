<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<title>Бокс — пошаговый бой на двоих</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d0f14; --panel:#161a22; --panel2:#1e2330; --line:#2d3546;
  --txt:#eef1f7; --dim:#98a2b8;
  --blue:#3d8bfd; --blueD:#173f86; --blueL:#7fb4ff;
  --red:#ff4d5e; --redD:#8d1c28; --redL:#ff9aa4;
  --ok:#3ad47c; --warn:#ffc44d; --bad:#ff4d5e;
}
html{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  display:flex; flex-direction:column;
  height:100vh; height:100dvh;
  overscroll-behavior:none;
  -webkit-user-select:none; user-select:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* ---------- АРЕНА ---------- */
#arena{flex:0 0 auto;display:flex;gap:6px;padding:6px 6px 3px;background:var(--panel);border-bottom:1px solid var(--line)}
.corner{flex:1 1 0;min-width:0;padding:7px;border-radius:14px;background:var(--panel2);border:2px solid var(--line);display:flex;flex-direction:column;gap:5px}
.corner.b{border-color:var(--blueD)}
.corner.r{border-color:var(--redD)}
.cname{font-size:11px;font-weight:800;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.corner.b .cname{color:var(--blueL)}
.corner.r .cname{color:var(--redL)}
.crow{display:flex;align-items:center;gap:7px}
.fig{flex:0 0 auto;width:34px;height:45px;display:block}
.corner.r .fig{transform:scaleX(-1)}
.stats{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
.lab{display:flex;justify-content:space-between;align-items:baseline;gap:4px;font-size:10px;font-weight:800;color:var(--dim);letter-spacing:.02em}
.lab b{color:var(--txt);font-size:13px;font-variant-numeric:tabular-nums}
.bar{position:relative;height:13px;border-radius:7px;background:#080a0e;border:1px solid #333c4f;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;display:block;height:100%;width:0;transition:width .3s ease,background .3s ease}
.bar u{position:absolute;top:0;bottom:0;left:80%;width:2px;background:#ffffff55}
.tele{display:none;font-size:10.5px;font-weight:900;text-align:center;padding:3px 2px;border-radius:7px;background:#4a2c00;color:#ffc44d;border:1px solid #7a4a00;line-height:1.2;white-space:nowrap}
.tele.on{display:block}
#rbar{flex:0 0 auto;text-align:center;font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--dim);padding:3px 0 5px;background:var(--panel);border-bottom:2px solid var(--line)}

/* ---------- ПАНЕЛЬ ---------- */
#panel{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px;display:flex;flex-direction:column;gap:8px}
h1{font-size:26px;line-height:1.15;font-weight:900;text-align:center}
h2{font-size:19px;font-weight:900;text-align:center;line-height:1.25}
.sub{font-size:15px;color:var(--dim);text-align:center;line-height:1.4;font-weight:600}
.card{background:var(--panel2);border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.b{border-color:var(--blueD);background:#121a2a}
.card.r{border-color:var(--redD);background:#22151a}
.spacer{flex:1 1 auto;min-height:4px}

/* ---------- КНОПКИ ---------- */
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.btn{width:100%;border:2px solid var(--line);border-radius:16px;background:var(--panel2);padding:18px 14px;font-size:19px;font-weight:800;text-align:center;line-height:1.2}
.btn:active{transform:scale(.975);filter:brightness(1.15)}
.btn.big{padding:24px 14px;font-size:22px}
.btn.blue{background:linear-gradient(#3d8bfd,#1f5fcf);border-color:#7fb4ff;color:#fff}
.btn.red{background:linear-gradient(#ff4d5e,#cf2436);border-color:#ff9aa4;color:#fff}
.btn.gold{background:linear-gradient(#ffc44d,#e09400);border-color:#ffe0a0;color:#2a1c00}
.btn.ghost{background:transparent;color:var(--dim);font-size:16px;padding:14px;border-style:dashed}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;min-height:clamp(64px,10.5vh,92px);padding:8px 6px;border-radius:16px;border:2px solid var(--line);background:var(--panel2)}
.act.wide{grid-column:1/-1;flex-direction:row;justify-content:flex-start;text-align:left;gap:11px;min-height:clamp(52px,8vh,72px);padding:8px 16px}
.act.wide .col{display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.act.wide .t,.act.wide .s{text-align:left}
.act:active{transform:scale(.97);filter:brightness(1.2)}
.act .em{font-size:22px;line-height:1}
.act .t{font-size:17px;font-weight:900;line-height:1.1;text-align:center}
.act .s{font-size:11px;font-weight:700;color:var(--dim);text-align:center;line-height:1.25}
.act.atk{border-color:#6d3540;background:#251a1d}
.act.atk .t{color:#ff9aa4}
.act.def{border-color:#2c4b66;background:#141d28}
.act.def .t{color:#8ec6ff}
.hdr{font-size:11px;font-weight:900;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}

/* ---------- РЕЗУЛЬТАТ РАУНДА ---------- */
.rw{display:flex;flex-direction:column;gap:4px}
.rw .who{font-size:16px;font-weight:900}
.rw.b .who{color:var(--blueL)}
.rw.r .who{color:var(--redL)}
.rw .res{font-size:15px;font-weight:700;line-height:1.35;color:var(--txt)}
.rw .res.miss{color:var(--dim)}
.dmg{display:inline-block;font-weight:900;color:#fff;background:#c0202f;border-radius:8px;padding:1px 8px;margin-left:4px}
.dmg.half{background:#8a6a00}
.zero{display:inline-block;font-weight:900;color:#0d0f14;background:var(--ok);border-radius:8px;padding:1px 8px;margin-left:4px}
.warnline{font-size:13px;font-weight:800;color:var(--warn);line-height:1.3}
.snap{display:flex;gap:10px;font-size:14px;font-weight:800;justify-content:space-between;border-top:1px solid var(--line);padding-top:8px;flex-wrap:wrap}
.snap span{white-space:nowrap}

/* ---------- ЖУРНАЛ ---------- */
#logWrap{flex:0 0 auto;background:var(--panel);border-top:2px solid var(--line)}
#logHead{display:flex;justify-content:space-between;align-items:center;padding:5px 12px 3px;font-size:10px;font-weight:900;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
#log{height:16vh;min-height:70px;max-height:155px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 12px 9px;font-size:13px;line-height:1.42}
#log .ent{padding:7px 0;border-top:1px dashed var(--line)}
#log .ent:first-child{border-top:none}
#log .rn{font-weight:900;color:var(--warn);font-size:12px;letter-spacing:.08em}
#log .l{color:#cfd6e4}
#log b.b{color:var(--blueL)}
#log b.r{color:var(--redL)}
#log .empty{color:#5d6679;padding:8px 0;font-style:italic}

/* совсем маленькие экраны — всё должно влезать без прокрутки панели */
@media (max-height:680px){
  #panel{gap:6px;padding:8px}
  h1{font-size:23px}
  h2{font-size:17px}
  .sub{font-size:14px}
}
details{background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:10px 14px}
summary{font-size:16px;font-weight:800;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";color:var(--warn)}
details[open] summary::before{content:"▾ "}
details .body{font-size:14px;line-height:1.5;color:#c3cbdb;padding-top:10px;display:flex;flex-direction:column;gap:8px}
details .body b{color:var(--txt)}
details .body .k{color:var(--warn);font-weight:800}
</style>
</head>
<body>

<div id="arena">
  <div class="corner b" id="c0">
    <div class="cname">🔵 СИНИЙ УГОЛ</div>
    <div class="crow">
      <svg class="fig" viewBox="0 0 100 130" aria-hidden="true">
        <g fill="#3d8bfd">
          <circle cx="50" cy="22" r="16"/>
          <rect x="30" y="42" width="40" height="46" rx="10"/>
          <rect x="36" y="88" width="12" height="34" rx="6"/>
          <rect x="52" y="88" width="12" height="34" rx="6"/>
          <rect x="16" y="46" width="14" height="26" rx="7"/>
          <rect x="70" y="46" width="14" height="26" rx="7"/>
        </g>
        <g fill="#ff4d5e">
          <circle cx="24" cy="30" r="12"/>

      </svg>

        <div class="lab"><span>ЗДОРОВЬЕ</span><b id="hp0v">100</b></div>
        <div class="bar"><i id="hp0"></i></div>
        <div class="lab"><span>УСТАЛОСТЬ</span><b id="fa0v">0</b></div>
        <div class="bar"><i id="fa0"></i><u></u></div>

  <div class="corner r" id="c1">
    <div class="cname">🔴 КРАСНЫЙ УГОЛ</div>
    <div class="crow">
      <svg class="fig" viewBox="0 0 100 130" aria-hidden="true">
        <g fill="#ff4d5e">
          <circle cx="50" cy="22" r="16"/>
          <rect x="30" y="42" width="40" height="46" rx="10"/>
          <rect x="36" y="88" width="12" height="34" rx="6"/>
          <rect x="52" y="88" width="12" height="34" rx="6"/>
          <rect x="16" y="46" width="14" height="26" rx="7"/>
          <rect x="70" y="46" width="14" height="26" rx="7"/>
        </g>
        <g fill="#3d8bfd">
          <circle cx="24" cy="30" r="12"/>
          <circle cx="76" cy="30" r="12"/>
        </g>
      </svg>
      <div class="stats">
        <div class="lab"><span>ЗДОРОВЬЕ</span><b id="hp1v">100</b></div>
        <div class="bar"><i id="hp1"></i></div>
        <div class="lab"><span>УСТАЛОСТЬ</span><b id="fa1v">0</b></div>
        <div class="bar"><i id="fa1"></i><u></u></div>
      </div>
    </div>
    <div class="tele" id="te1">⚡ ТЯЖЁЛЫЙ УДАР</div>
  </div>
</div>

<div id="rbar">РАУНД 1 ИЗ 10</div>

<div id="panel"></div>

<div id="logWrap">
  <div id="logHead"><span>Журнал боя</span><span id="logHint">листается ↕</span></div>
  <div id="log"><div class="empty">Бой ещё не начался.</div></div>
</div>

<script>
"use strict";

/* =========================================================================
   БАЛАНС
   ========================================================================= */
var MAX_HP      = 100;
var MAX_FAT     = 100;
var MAX_ROUNDS  = 10;
var TIRED_AT    = 80;    // усталость ВЫШЕ этого значения -> штраф к урону
var TIRED_MULT  = 2/3;   // "на треть меньше"
var REST        = 8;     // пассивное восстановление усталости каждый раунд

/* Спорные места в правилах вынесены сюда — меняются одной строкой.
   1) В ТЗ есть две взаимоисключающие фразы про апперкот в голову против
      высокого блока. Взят вариант "блок гасит апперкот в голову" — иначе
      апперкот бьёт вообще всё, кроме шага назад, и джеб теряет смысл.
   2) Если бы нырок пробивался апперкотом в корпус тоже, то апперкот в голову
      стал бы строго хуже апперкота в корпус (мёртвая кнопка). Поэтому нырок
      пробивает только апперкот в ГОЛОВУ — боксёр ныряет прямо под удар. */
var BLOCK_STOPS_HEAD_UPPERCUT   = true;
var UPPERCUT_PIERCES_SLIP_HEAD_ONLY = true;
var CROSS_BLOCK_MULT = 0.5;   // высокий блок гасит половину кросса

var ACT = {
  jab:      {id:'jab',      kind:'attack', name:'Прямой',      em:'👊', dmg:20, fat:14,  level:true,  hint:'20 урона · сразу'},
  uppercut: {id:'uppercut', kind:'attack', name:'Апперкот',    em:'🥊', dmg:35, fat:22,  level:true,  hint:'35 урона · пробивает нырок'},
  cross:    {id:'cross',    kind:'attack', name:'Кросс',       em:'💥', dmg:50, fat:32,  level:false, hint:'50 урона · замах на раунд'},
  block:    {id:'block',    kind:'defense',name:'Высокий блок',em:'🛡️', dmg:0,  fat:6,   level:false, hint:'закрывает голову'},
  slip:     {id:'slip',     kind:'defense',name:'Нырок',       em:'🌀', dmg:0,  fat:8,   level:false, hint:'закрывает корпус'},
  step:     {id:'step',     kind:'defense',name:'Шаг назад',   em:'👣', dmg:0,  fat:-10, level:false, hint:'уход + отдых'},
  crossLand:{id:'crossLand',kind:'attack', name:'Кросс',       em:'💥', dmg:50, fat:6,   level:false, hint:''}
};

/* =========================================================================
   СОСТОЯНИЕ
   ========================================================================= */
var F, round, phase, active, choices, pendLevel, lastReport;

function newFight(){
  F = [
    {i:0, name:'СИНИЙ',  cls:'b', ico:'🔵', hp:MAX_HP, fat:0, pending:false},
    {i:1, name:'КРАСНЫЙ',cls:'r', ico:'🔴', hp:MAX_HP, fat:0, pending:false}
  ];
  round = 1;
  choices = [null,null];
  pendLevel = null;
  lastReport = null;
  document.getElementById('log').innerHTML = '<div class="empty">Бой ещё не начался.</div>';
}

/* =========================================================================
   РАЗБОР УДАРА:  чем закончилась атака atk против действия защитника def
   ========================================================================= */
function resolve(atk, def){
  var d = def ? def.id : null;

  /* Кросс, объявленный в прошлом раунде, прилетает СЕЙЧАС */
  if(atk.id === 'crossLand'){
    if(d === 'block') return {mult:CROSS_BLOCK_MULT, why:'высокий блок принял кросс — урон вдвое меньше'};
    if(d === 'step')  return {mult:1, why:'шаг назад НЕ спасает от объявленного кросса'};
    if(d === 'slip')  return {mult:1, why:'нырок не помогает против кросса'};
    return {mult:1, why:'кросс дошёл без помех'};
  }

  /* Замах: в этом раунде урона нет */
  if(atk.id === 'cross') return null;

  /* Шаг назад разрывает дистанцию и уводит от любого мгновенного удара */
  if(d === 'step') return {mult:0, why:'шаг назад разорвал дистанцию — удар не достал'};

  if(atk.id === 'jab'){
    if(atk.lvl === 'head'){
      if(d === 'block') return {mult:0, why:'высокий блок закрыл голову'};
      if(d === 'slip')  return {mult:1, why:'нырок уводил корпус, а удар шёл в голову'};
      return {mult:1, why:'соперник не защищался'};
    }
    if(d === 'slip')  return {mult:0, why:'нырок увёл корпус из-под удара'};
    if(d === 'block') return {mult:1, why:'высокий блок держал голову — корпус открыт'};
    return {mult:1, why:'соперник не защищался'};
  }

  if(atk.id === 'uppercut'){
    if(atk.lvl === 'head'){
      if(d === 'block') return BLOCK_STOPS_HEAD_UPPERCUT
        ? {mult:0, why:'высокий блок погасил апперкот в голову'}
        : {mult:1, why:'апперкот прошёл под блоком'};
      if(d === 'slip')  return {mult:1, why:'АППЕРКОТ ПРОБИЛ НЫРОК НАСКВОЗЬ — соперник нырнул прямо под удар'};
      return {mult:1, why:'соперник не защищался'};
    }
    if(d === 'slip')  return UPPERCUT_PIERCES_SLIP_HEAD_ONLY
      ? {mult:0, why:'нырок ушёл вниз и закрыл корпус'}
      : {mult:1, why:'АППЕРКОТ ПРОБИЛ НЫРОК НАСКВОЗЬ'};
    if(d === 'block') return {mult:1, why:'высокий блок держал голову — корпус открыт'};
    return {mult:1, why:'соперник не защищался'};
  }

  return {mult:1, why:''};
}

function label(c){
  if(!c) return '—';
  var a = ACT[c.id];
  if(c.id === 'crossLand') return 'КРОСС прилетает';
  if(c.id === 'cross')     return 'Кросс (замах)';
  if(c.lvl) return a.name + (c.lvl === 'head' ? ' в голову' : ' в корпус');
  return a.name;
}

/* =========================================================================
   ПРОСЧЁТ РАУНДА (одновременный)
   ========================================================================= */
function resolveRound(){
  var startFat = [F[0].fat, F[1].fat];
  var tired    = [startFat[0] > TIRED_AT, startFat[1] > TIRED_AT];
  var out = [null,null];
  var i;

  for(i = 0; i < 2; i++){
    var mine = choices[i], A = ACT[mine.id];
    if(A.kind !== 'attack'){ out[i] = {type:'def'}; continue; }
    if(mine.id === 'cross'){ out[i] = {type:'windup'}; continue; }
    var r = resolve(mine, choices[1-i]);
    var dmg = Math.round(A.dmg * (tired[i] ? TIRED_MULT : 1) * r.mult);
    out[i] = {type:'atk', dmg:dmg, mult:r.mult, why:r.why, tired:tired[i], base:A.dmg};
  }

  /* урон применяется одновременно — возможен двойной нокаут */
  F[1].hp = Math.max(0, F[1].hp - (out[0].dmg || 0));
  F[0].hp = Math.max(0, F[0].hp - (out[1].dmg || 0));

  for(i = 0; i < 2; i++){
    F[i].fat = Math.max(0, Math.min(MAX_FAT, F[i].fat + ACT[choices[i].id].fat - REST));
    if(choices[i].id === 'cross')          F[i].pending = true;
    else if(choices[i].id === 'crossLand') F[i].pending = false;
  }

  lastReport = {round:round, choices:[choices[0], choices[1]], out:out,
                hp:[F[0].hp, F[1].hp], fat:[F[0].fat, F[1].fat], tired:tired};
  pushLog(lastReport);
}

/* =========================================================================
   ТЕКСТ РЕЗУЛЬТАТА
   ========================================================================= */
function resultLine(i, rep){
  var o = rep.out[i], c = rep.choices[i];
  if(o.type === 'def')    return '<span class="res miss">Уходит в защиту — ' + ACT[c.id].hint + '.</span>';
  if(o.type === 'windup') return '<span class="res">⚡ Замахивается кроссом. Удар прилетит в СЛЕДУЮЩЕМ раунде.</span>';
  var tail = o.tired ? '<div class="warnline">😮‍💨 Выдохся (усталость выше ' + TIRED_AT + ') — урон снижен на треть.</div>' : '';
  if(o.dmg === 0)
    return '<span class="res miss">✖ Мимо: ' + o.why + '.<span class="zero">0</span></span>' + tail;
  var half = o.mult < 1 && o.mult > 0;
  return '<span class="res">' + (half ? '➖ Частично: ' : '✔ Попал: ') + o.why + '.' +
         '<span class="dmg' + (half ? ' half' : '') + '">−' + o.dmg + '</span></span>' + tail;
}

function reportHTML(rep){
  var h = '';
  for(var i = 0; i < 2; i++){
    h += '<div class="card ' + F[i].cls + '"><div class="rw ' + F[i].cls + '">' +
         '<div class="who">' + F[i].ico + ' ' + F[i].name + ' — ' + label(rep.choices[i]) + '</div>' +
         resultLine(i, rep) + '</div></div>';
  }
  h += '<div class="card"><div class="snap">' +
       '<span>🔵 ❤️ ' + rep.hp[0] + ' · 😮‍💨 ' + rep.fat[0] + '</span>' +
       '<span>🔴 ❤️ ' + rep.hp[1] + ' · 😮‍💨 ' + rep.fat[1] + '</span></div></div>';
  return h;
}

function pushLog(rep){
  var log = document.getElementById('log');
  var e = log.querySelector('.empty');
  if(e) e.remove();
  var d = document.createElement('div');
  d.className = 'ent';
  var txt = '<div class="rn">РАУНД ' + rep.round + '</div>';
  for(var i = 0; i < 2; i++){
    var o = rep.out[i], tag = '';
    if(o.type === 'def')         tag = 'защита';
    else if(o.type === 'windup') tag = '⚡ ЗАМАХ КРОССОМ — сработает в раунде ' + (rep.round + 1);
    else if(o.dmg === 0)         tag = 'мимо (' + o.why + ')';
    else                         tag = '−' + o.dmg + ' (' + o.why + ')' + (o.tired ? ' [выдохся]' : '');
    txt += '<div class="l"><b class="' + F[i].cls + '">' + F[i].ico + ' ' + F[i].name + '</b>: ' +
           label(rep.choices[i]) + ' → ' + tag + '</div>';
  }
  txt += '<div class="l" style="color:#8b95a8">итог: 🔵 ' + rep.hp[0] + ' hp / ' + rep.fat[0] +
         ' уст.  ·  🔴 ' + rep.hp[1] + ' hp / ' + rep.fat[1] + ' уст.</div>';
  d.innerHTML = txt;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

/* =========================================================================
   ОТРИСОВКА ШАПКИ
   ========================================================================= */
function hpColor(p){ return p > 50 ? '#3ad47c' : (p > 25 ? '#ffc44d' : '#ff4d5e'); }
function faColor(v){ return v > TIRED_AT ? '#ff7a1a' : (v > 55 ? '#ffc44d' : '#39b8e0'); }

function paintArena(){
  for(var i = 0; i < 2; i++){
    var hp = F[i].hp, fa = F[i].fat;
    var hb = document.getElementById('hp' + i), fb = document.getElementById('fa' + i);
    hb.style.width = (hp / MAX_HP * 100) + '%';
    hb.style.background = hpColor(hp / MAX_HP * 100);
    fb.style.width = (fa / MAX_FAT * 100) + '%';
    fb.style.background = faColor(fa);
    document.getElementById('hp' + i + 'v').textContent = hp;
    var fv = document.getElementById('fa' + i + 'v');
    fv.textContent = fa;
    fv.style.color = fa > TIRED_AT ? '#ff7a1a' : '';
    document.getElementById('te' + i).className = 'tele' + (F[i].pending ? ' on' : '');
  }
  document.getElementById('rbar').textContent =
    (phase === 'over') ? 'БОЙ ОКОНЧЕН' : ('РАУНД ' + round + ' ИЗ ' + MAX_ROUNDS);
}

/* =========================================================================
   ЭКРАНЫ
   ========================================================================= */
var P = document.getElementById('panel');

function screenStart(){
  return '<h1>🥊 ПОШАГОВЫЙ БОКС</h1>' +
    '<div class="sub">Игра на двоих на одном телефоне.<br>Выбираете ходы по очереди и втайне друг от друга — потом ходы вскрываются одновременно.</div>' +
    '<button class="btn gold big" data-go="begin">НАЧАТЬ БОЙ</button>' +
    '<details><summary>Правила</summary><div class="body">' +
      '<div><b>Атаки</b><br>' +
      '👊 <span class="k">Прямой</span> — 20 урона, сразу. Выбираешь голову или корпус.<br>' +
      '🥊 <span class="k">Апперкот</span> — 35 урона, сразу. Пробивает нырок насквозь, если бьёт в голову.<br>' +
      '💥 <span class="k">Кросс</span> — 50 урона, но с замахом: объявляется сейчас, прилетает в следующем раунде. Соперник видит замах. Очень выматывает.</div>' +
      '<div><b>Защиты</b><br>' +
      '🛡️ <span class="k">Высокий блок</span> — гасит удары в голову, но корпус открыт. Кросс режет вдвое.<br>' +
      '🌀 <span class="k">Нырок</span> — гасит удары в корпус, но подставляет голову под апперкот.<br>' +
      '👣 <span class="k">Шаг назад</span> — уводит от любого мгновенного удара и хорошо снимает усталость, но НЕ спасает от объявленного кросса.</div>' +
      '<div><b>Усталость</b><br>Растёт от атак и падает от пассивных действий. Если усталость <span class="k">выше ' + TIRED_AT +
      '</span>, твоя атака бьёт на треть слабее.</div>' +
      '<div><b>Конец боя</b><br>Нокаут (0 hp) или ' + MAX_ROUNDS + ' раундов — тогда побеждает тот, у кого больше здоровья.</div>' +
    '</div></details>';
}

function screenHandoff(){
  var me = F[active], op = F[1 - active];
  var note = '';
  if(op.pending)
    note += '<div class="card"><div class="warnline">⚡ ' + op.ico + ' ' + op.name +
            ' объявил тяжёлый удар в прошлом раунде. Он прилетит в этом раунде.</div></div>';
  if(choices[1 - active] && !op.pending)
    note += '<div class="sub">Выбор соперника уже сделан и скрыт.</div>';

  return '<h2>Передай телефон<br><span style="color:var(--' + (active === 0 ? 'blueL' : 'redL') + ')">' +
    me.ico + ' ' + me.name + ' УГОЛ</span></h2>' +
    '<div class="sub">Второй игрок не должен видеть экран.</div>' + note +
    '<div class="spacer"></div>' +
    '<button class="btn ' + (active === 0 ? 'blue' : 'red') + ' big" data-go="choose">Я ' + me.ico + ' ' + me.name + ' — открыть выбор</button>';
}

function actBtn(id, wide){
  var a = ACT[id];
  var body = wide
    ? '<span class="em">' + a.em + '</span><span class="col"><span class="t">' + a.name + '</span><span class="s">' + a.hint + '</span></span>'
    : '<span class="em">' + a.em + '</span><span class="t">' + a.name + '</span><span class="s">' + a.hint + '</span>';
  return '<button class="act ' + (a.kind === 'attack' ? 'atk' : 'def') + (wide ? ' wide' : '') +
    '" data-pick="' + id + '">' + body + '</button>';
}

function screenChoose(){
  var me = F[active];
  var warn = me.fat > TIRED_AT
    ? '<div class="card"><div class="warnline">😮‍💨 Усталость ' + me.fat + ' — твоя атака в этом раунде бьёт на треть слабее. Стоит отдохнуть.</div></div>'
    : '';
  return '<h2>' + me.ico + ' ' + me.name + ', твой ход</h2>' + warn +
    '<div class="hdr">Атака</div><div class="grid">' +
      actBtn('jab') + actBtn('uppercut') + actBtn('cross', true) +
    '</div>' +
    '<div class="hdr">Защита</div><div class="grid">' +
      actBtn('block') + actBtn('slip') + actBtn('step', true) +
    '</div>';
}

function screenLevel(){
  var a = ACT[pendLevel];
  return '<h2>' + a.em + ' ' + a.name + '<br>куда бьёшь?</h2>' +
    '<div class="sub">' + a.dmg + ' урона' + (pendLevel === 'uppercut'
      ? '. В голову — пробивает нырок, но гасится высоким блоком. В корпус — проходит сквозь высокий блок.'
      : '. В голову — гасится высоким блоком. В корпус — гасится нырком.') + '</div>' +
    '<button class="btn ' + (active === 0 ? 'blue' : 'red') + ' big" data-lvl="head">🎯 В ГОЛОВУ</button>' +
    '<button class="btn ' + (active === 0 ? 'blue' : 'red') + ' big" data-lvl="body">🎯 В КОРПУС</button>' +
    '<button class="btn ghost" data-go="choose">← Назад к действиям</button>';
}

function screenConfirm(){
  var me = F[active], last = (active === 1) || !!choices[1];
  return '<h2>' + me.ico + ' ' + me.name + '<br>твой выбор:</h2>' +
    '<div class="card ' + me.cls + '"><div style="font-size:24px;font-weight:900;text-align:center;line-height:1.2">' +
      ACT[choices[active].id].em + ' ' + label(choices[active]) + '</div></div>' +
    '<div class="sub">Запомни и не показывай сопернику.</div>' +
    '<div class="spacer"></div>' +
    '<button class="btn gold big" data-go="done">' + (last ? 'ВСКРЫТЬ РАУНД →' : 'ГОТОВО — передать телефон →') + '</button>' +
    '<button class="btn ghost" data-go="choose">← Изменить выбор</button>';
}

function screenReveal(){
  var over = F[0].hp <= 0 || F[1].hp <= 0 || round >= MAX_ROUNDS;
  return '<h2>Раунд ' + lastReport.round + ' — вскрытие</h2>' + reportHTML(lastReport) +
    '<button class="btn gold big" data-go="' + (over ? 'over' : 'next') + '">' +
    (over ? 'ИТОГ БОЯ →' : 'СЛЕДУЮЩИЙ РАУНД →') + '</button>';
}

function screenOver(){
  var a = F[0].hp, b = F[1].hp, title, sub;
  if(a <= 0 && b <= 0){ title = '🤝 ДВОЙНОЙ НОКАУТ'; sub = 'Оба на настиле. Ничья.'; }
  else if(a <= 0){ title = '🔴 ПОБЕДИЛ КРАСНЫЙ'; sub = 'Нокаут в раунде ' + round + '.'; }
  else if(b <= 0){ title = '🔵 ПОБЕДИЛ СИНИЙ';  sub = 'Нокаут в раунде ' + round + '.'; }
  else if(a > b){ title = '🔵 ПОБЕДИЛ СИНИЙ';  sub = 'По очкам после ' + MAX_ROUNDS + ' раундов: ' + a + ' против ' + b + '.'; }
  else if(b > a){ title = '🔴 ПОБЕДИЛ КРАСНЫЙ'; sub = 'По очкам после ' + MAX_ROUNDS + ' раундов: ' + b + ' против ' + a + '.'; }
  else { title = '🤝 НИЧЬЯ'; sub = 'После ' + MAX_ROUNDS + ' раундов у обоих по ' + a + ' здоровья.'; }
  return '<h1>' + title + '</h1><div class="sub">' + sub + '</div>' +
    '<div class="card"><div class="snap">' +
      '<span>🔵 ❤️ ' + Math.max(0, a) + '</span><span>🔴 ❤️ ' + Math.max(0, b) + '</span></div></div>' +
    '<div class="spacer"></div>' +
    '<button class="btn gold big" data-go="restart">🔄 ИГРАТЬ ЗАНОВО</button>';
}

/* =========================================================================
   МАШИНА СОСТОЯНИЙ
   ========================================================================= */
function render(){
  var h = '';
  if(phase === 'start')        h = screenStart();
  else if(phase === 'handoff') h = screenHandoff();
  else if(phase === 'choose')  h = screenChoose();
  else if(phase === 'level')   h = screenLevel();
  else if(phase === 'confirm') h = screenConfirm();
  else if(phase === 'reveal')  h = screenReveal();
  else if(phase === 'over')    h = screenOver();
  P.innerHTML = h;
  P.scrollTop = 0;
  paintArena();
}

function startRound(){
  choices = [null, null];
  pendLevel = null;
  for(var i = 0; i < 2; i++) if(F[i].pending) choices[i] = {id:'crossLand'};
  nextChooser(0);
}

function nextChooser(from){
  for(var i = from; i < 2; i++){
    if(!choices[i]){ active = i; phase = 'handoff'; render(); return; }
  }
  resolveRound();
  phase = 'reveal';
  render();
}

P.addEventListener('click', function(ev){
  var t = ev.target.closest('[data-go],[data-pick],[data-lvl]');
  if(!t) return;

  if(t.dataset.pick){
    var id = t.dataset.pick;
    if(ACT[id].level){ pendLevel = id; phase = 'level'; }
    else { choices[active] = {id:id}; phase = 'confirm'; }
    render(); return;
  }

  if(t.dataset.lvl){
    choices[active] = {id:pendLevel, lvl:t.dataset.lvl};
    phase = 'confirm';
    render(); return;
  }

  var go = t.dataset.go;
  if(go === 'begin'){ newFight(); startRound(); }
  else if(go === 'choose'){ phase = 'choose'; render(); }
  else if(go === 'done'){ nextChooser(active + 1); }
  else if(go === 'next'){ round++; startRound(); }
  else if(go === 'over'){ phase = 'over'; render(); }
  else if(go === 'restart'){ newFight(); phase = 'start'; render(); }
});

/* старт */
newFight();
phase = 'start';
render();
</script>
</body>
</html>
