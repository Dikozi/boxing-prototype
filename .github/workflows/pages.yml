# Деплой «Клинча» на GitHub Pages.
# Игра — один самодостаточный index.html, поэтому сборки нет: файл просто
# кладётся в корень сайта. Папка art/ — исходники иллюстраций, в сайт не идёт:
# картинки уже вшиты в index.html как data-URI.
name: Deploy to Pages

on:
  push:
    branches: [claude/boxing-game-prototype-6gs9m8]
    paths: ['index.html', 'tools/**', 'INVARIANTS.md', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Пробники из tools/ — пороги из INVARIANTS.md. Деплой ждёт зелёного прогона:
  # красный файл на сайт не попадает.
  check:
    name: Пробники
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright
        working-directory: tools
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Все пробники
        run: sh tools/check.sh

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Включить Pages, если ещё не включён
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Собрать сайт из одного файла
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
